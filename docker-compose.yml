services:

  mysqldb:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - devops-net
    restart: unless-stopped

  springapp:
    image: devops-app:1.0
    container_name: springapp
    depends_on:
      - mysqldb
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/test_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    networks:
      - devops-net
    restart: unless-stopped

  angular:
    image: devops-front:1.0
    container_name: angular
    depends_on:
      - springapp
    ports:
      - "4200:80"
    networks:
      - devops-net
    restart: unless-stopped

networks:
  devops-net:

volumes:
  mysql_data:
